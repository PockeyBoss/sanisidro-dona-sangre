name: Activar rediseño visual
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  activar:
    if: ${{ !contains(github.event.head_commit.message, 'Activar rediseño visual') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar CSS y JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'redesign.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="redesign.css">\n<script src="redesign.js" defer></script>\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Activar rediseño visual"
          git push
